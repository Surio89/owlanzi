; ---------------------------------------------------------------------------
;  Owlanzi - eigene Firmware fuer die Ulanzi TC001
;
;  Drei Umgebungen:
;    esp32dev  nacktes Devboard zum Entwickeln, 4 MB, ohne Matrix
;    ulanzi    die TC001 selbst, 8 MB, mit OTA-Partitionen
;    release   wie ulanzi, aber ohne die lokale secrets_local.h - das ist
;              die einzige Umgebung, aus der eine .bin weitergegeben wird
;
;  Bauen:      pio run -e ulanzi
;  Aufspielen: pio run -e ulanzi -t upload
;  Verteilen:  tools\make-installer.ps1   (baut release und prueft das Abbild)
; ---------------------------------------------------------------------------

[common]
framework = arduino
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    fastled/FastLED @ ^3.6.0
build_flags = -DCORE_DEBUG_LEVEL=1 -Os
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = ${common.framework}
lib_deps  = ${common.lib_deps}
build_flags = ${common.build_flags}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_port  = COM5
monitor_port = COM5

[env:ulanzi]
platform  = espressif32
board     = esp32dev
framework = ${common.framework}
lib_deps  = ${common.lib_deps}
build_flags = ${common.build_flags} -DULANZI_TC001
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
; Die TC001 hat 8 MB Flash. Zwei App-Partitionen, damit spaeter OTA moeglich
; ist, ohne das Schema zu wechseln und alles neu flashen zu muessen.
board_upload.flash_size = 8MB
board_build.partitions  = default_8MB.csv

[env:release]
; Das ist die Umgebung, aus der die veroeffentlichte .bin entsteht - gleiche
; Hardware wie ulanzi, aber OHNE die Seed-Datei des Entwicklers. Ohne den
; Schalter zieht main.cpp secrets_local.h mit ins Abbild, und dann traegt
; jede weitergegebene .bin das WLAN- und das Owlet-Passwort mit sich herum.
platform  = espressif32
board     = esp32dev
framework = ${common.framework}
lib_deps  = ${common.lib_deps}
build_flags = ${common.build_flags} -DULANZI_TC001 -DNO_LOCAL_SECRETS
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
board_upload.flash_size = 8MB
board_build.partitions  = default_8MB.csv

; ---------------------------------------------------------------------------
;  Anmerkung zu den mbedTLS-Puffern
;
;  Am 4.9. gemessen: mit laufendem Webserver, TLS und Anzeige bleiben rund
;  228 kB Heap frei, groesster zusammenhaengender Block 107 kB. Ein
;  TLS-Handshake braucht etwa 45 kB. Die Puffer muessen also NICHT
;  verkleinert werden - was unter Arduino ohnehin nicht per build_flag ginge,
;  weil mbedTLS dort vorkompiliert kommt.
; ---------------------------------------------------------------------------
