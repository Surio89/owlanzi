; ---------------------------------------------------------------------------
;  owlanzi - custom firmware for the Ulanzi TC001
;
;  Three environments:
;    esp32dev  bare dev board, 4 MB, no matrix attached
;    ulanzi    the TC001 itself, 4 MB, with OTA partitions
;    release   like ulanzi but without the local secrets_local.h - the only
;              environment a .bin may ever be handed out from
;
;  Build:    pio run -e ulanzi
;  Upload:   pio run -e ulanzi -t upload
;  Publish:  tools\make-installer.ps1   (builds release and scans the image)
; ---------------------------------------------------------------------------

[common]
framework = arduino
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    fastled/FastLED @ ^3.6.0
build_flags = -DCORE_DEBUG_LEVEL=1 -Os
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = ${common.framework}
lib_deps  = ${common.lib_deps}
build_flags = ${common.build_flags}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_port  = COM5
monitor_port = COM5

[env:ulanzi]
platform  = espressif32
board     = esp32dev
framework = ${common.framework}
lib_deps  = ${common.lib_deps}
build_flags = ${common.build_flags} -DULANZI_TC001
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
; TC001 hardware reports 4 MB. Keep two app partitions within this limit
; so both USB startup and later OTA updates use the same valid layout.
board_upload.flash_size = 4MB
board_build.partitions  = min_spiffs.csv

[env:release]
; This is the environment the published .bin comes from - same hardware as
; ulanzi, but WITHOUT the developer's seed file. Without the flag main.cpp
; pulls secrets_local.h into the image, and every copy handed out then
; carries that person's Wi-Fi and Owlet password with it.
platform  = espressif32
board     = esp32dev
framework = ${common.framework}
lib_deps  = ${common.lib_deps}
build_flags = ${common.build_flags} -DULANZI_TC001 -DNO_LOCAL_SECRETS
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
board_upload.flash_size = 4MB
board_build.partitions  = min_spiffs.csv

; ---------------------------------------------------------------------------
;  A note on the mbedTLS buffers
;
;  Measured with the web server, TLS and the display all running: about
;  228 kB of heap free, largest contiguous block 107 kB. A TLS handshake
;  needs roughly 45 kB. So the buffers do NOT need shrinking - which under
;  Arduino would not work through a build flag anyway, because mbedTLS comes
;  precompiled there.
; ---------------------------------------------------------------------------
